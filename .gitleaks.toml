# gitleaks config: default rules, plus an allowlist for lockfile checksum lines (which look like API keys).
# Matching is on the exact line shape, so tokens elsewhere in lockfiles (e.g. registry URLs) are still caught.
[extend]
useDefault = true

[[allowlists]]
description = "Lockfile checksum lines are not secrets"
regexTarget = "line"
regexes = [
  # Podfile.lock SPEC CHECKSUMS / PODFILE CHECKSUM: `  Name: <40 hex>`
  '''^\s*[A-Za-z0-9_.+/-]+: [0-9a-f]{40}$''',
  '''^PODFILE CHECKSUM: [0-9a-f]{40}$''',
  # yarn.lock (berry): `  checksum: 10c0/<128 hex>`
  '''^\s*checksum: (10c0/)?[0-9a-f]{64,128}$''',
]

[[allowlists]]
# A fake AWS key used as a redaction test fixture in early history. Matched by value, not by commit
# fingerprint, because rebase merges rewrite commit SHAs.
description = "Known fake test fixture values"
regexTarget = "secret"
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']
