name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages (lint, test, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn test:scripts
      - run: yarn typecheck

  cli-e2e:
    name: CLI e2e (feature add round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      # The endpoint generator test type-checks and lints a copy of the template with its dependencies.
      - name: Install the template
        working-directory: template
        run: yarn install --immutable
      - run: yarn workspace create-tempo-app test:e2e

  template-js:
    name: Template (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # The lint plugins resolve from the linked packages/eslint-config, so install the root first.
      - name: Install workspace packages
        working-directory: .
        run: yarn install --immutable
      # `yarn api:check` and `yarn backend:check` (part of verify) run the built tempo-api CLI of the linked dev-api package
      # and the built engine of the linked local-backend package; `yarn test:backend` uses the engine's test kit.
      - name: Build the tempo-api, tempo and local backend tools
        working-directory: .
        run: yarn build:tools
      - run: yarn install --immutable
      - run: yarn verify
      # The same suite again, answered by the Tempo local backend (backend/) started in memory in each test file.
      - run: yarn test:backend --ci
      - run: yarn test:ai-log
      - run: yarn test:ai-sync
      - run: yarn test:assets
      - run: yarn assets:check
      - name: Bundle dry run (iOS and Android)
        run: yarn verify:bundle
      # Advisory: flags dependency versions outside the React Native profile. Never blocks the PR.
      - name: Align dependencies with the React Native profile
        run: yarn lint:align-deps
        continue-on-error: true

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - name: Lint every commit in the PR
        run: yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file. Update both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v
