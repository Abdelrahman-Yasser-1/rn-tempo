name: Local Backend app

# The Tempo Local Backend desktop app (Tauri 2). It runs on macOS only and only when the app, its engine or the
# dev API pieces the engine reuses change, so the main CI stays fast. The engine is bundled as a Node single
# executable (SEA) and the app is built into an unsigned .dmg, uploaded as an artifact. Apple silicon only: a
# single executable is built on the machine it runs on, so an Intel build would need a `macos-15-intel` runner
# and its own artifact; it is left out to keep this job cheap.
on:
  pull_request:
    paths:
      - 'apps/local-backend/**'
      - 'packages/dev-api/**'
      - 'packages/api-contract/**'
      - '.github/workflows/local-backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/local-backend/**'
      - 'packages/dev-api/**'
      - 'packages/api-contract/**'
      - '.github/workflows/local-backend.yml'
  workflow_dispatch:

concurrency:
  group: local-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Local Backend app (tests, engine, dmg)
    # macos-latest is Apple silicon (arm64).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 26: `node --build-sea` (Node 25.5+) builds the engine executable. The engine itself needs 24.3+.
          node-version: '26'
      - run: corepack enable
      - run: yarn install --immutable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/local-backend/app/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/local-backend/app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install mkcert (the HTTPS smoke test makes a certificate)
        run: brew install mkcert
      # The app starts the engine, and the engine reuses the dev API's certificate and redaction code.
      - name: Engine tests, types and build
        run: |
          yarn workspace @rn-tempo/dev-api build
          yarn workspace @rn-tempo/local-backend-engine lint
          yarn workspace @rn-tempo/local-backend-engine typecheck
          yarn workspace @rn-tempo/local-backend-engine test
          yarn workspace @rn-tempo/local-backend-engine build
      - name: Bundle the engine as a single executable and smoke test it
        run: |
          yarn workspace @rn-tempo/local-backend-engine build:sea
          yarn workspace @rn-tempo/local-backend-engine smoke:sea --require-https
      - name: App UI lint, types and tests
        run: |
          yarn workspace @rn-tempo/local-backend-app lint
          yarn workspace @rn-tempo/local-backend-app typecheck
          yarn workspace @rn-tempo/local-backend-app test
      - name: Rust format, tests and lints
        working-directory: apps/local-backend/app/src-tauri
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: Build the app and the .dmg (unsigned)
        run: yarn workspace @rn-tempo/local-backend-app tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-local-backend-dmg
          path: apps/local-backend/app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
