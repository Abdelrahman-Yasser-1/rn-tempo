<!doctype html>
<!-- Workbench. Accent #2455ae (light), #9cbcff (dark). Type scale: 10 px metadata, 12 px body, 24 px page title. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop API — Workbench</title><style>
:root{--accent:light-dark(#2455ae,#9cbcff);--on:light-dark(#fff,#102244);--base:12px;--title:24px;--radius:4px;--sidew:210px;--pad:19px}
*{box-sizing:border-box}
 :root{color-scheme:light dark;--paper:light-dark(#fffefa,#191c20);--side:light-dark(#f1f2ed,#212529);--inset:light-dark(#e9ece7,#292e32);--ink:light-dark(#202722,#edf1ec);--mute:light-dark(#4d5953,#b3c0b8);--line:light-dark(#cfd4ce,#424947);--edge:light-dark(#748077,#89968c);--good:light-dark(#176047,#85ddaf);--bad:light-dark(#a52e36,#ff9da5);--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--wash:color-mix(in srgb,var(--accent) 12%,var(--paper));font:var(--base)/1.45 var(--sans);color:var(--ink);background:var(--inset)}
:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
body{margin:0;padding:10px}
#frame{height:calc(100dvh - 20px);background:var(--paper);border:1px solid var(--edge);border-radius:12px;display:flex;flex-direction:column;overflow:clip;box-shadow:0 5px 16px #0002}
button,input,select,textarea{font:inherit;color:inherit}
button,select{cursor:pointer}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius);padding:6px 10px;white-space:nowrap}
button:hover,summary:hover{background:var(--wash)}
button:disabled{color:var(--mute);cursor:default}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
button.flat,nav button,.tabs button,.tree button{border-color:transparent;background:transparent}
button.flat:hover,nav button:hover,.tabs button:hover,.tree button:hover{background:var(--wash)}
button.on,.tabs .on,nav .on,.tree .on{background:var(--wash);color:var(--accent);font-weight:650}
.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
.primary:hover{background:var(--accent);filter:brightness(.92)}
svg.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.native,.toolbar,.row,.spread,.tabs,.crumb,footer,.brand{display:flex;align-items:center;gap:9px}
.spread{justify-content:space-between}
.native{height:32px;flex:none;background:var(--side);border-bottom:1px solid var(--line);padding:0 12px;gap:1px;position:relative;z-index:8;font-size:12px}
.native button{padding:3px 8px}
.lights{display:flex;gap:5px;margin-right:12px}
.lights i{width:10px;height:10px;background:#e87469;border-radius:100%}
.lights i:nth-child(2){background:#e8b34e}
.lights i:last-child{background:#69b67d}
.right{margin-left:auto}
.native .right{color:var(--mute)}
.toolbar{padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.brand{font-size:1.32rem;font-weight:720;letter-spacing:-.055em}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on)}
.mark svg{width:23px;height:23px;stroke-width:2.4}
.vline{height:20px;border-left:1px solid var(--line);margin:0 5px}
.badge,.method,.eyebrow,kbd,.mono,code,pre,footer,.count{font-family:var(--mono)}
.badge,.method{font-size:.85rem;font-weight:650}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 9px;color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--paper))}
.dot{width:7px;height:7px;display:inline-block;background:currentColor;border-radius:100%}
.off,.muted,small,kbd,.eyebrow{color:var(--mute)}
.method{color:var(--good)}
.post{color:var(--accent)}
.error{color:var(--bad)}
kbd{font-size:11px}
.shell{display:flex;flex:1;min-height:0}
.side,.rail,.inspector,.capture{background:var(--side);border-right:1px solid var(--line);overflow:auto;flex:none}
.side{width:var(--sidew);padding:14px 10px}
.side button{justify-content:flex-start;width:100%;text-align:left;min-height:29px}
.side details{margin:3px 0}
.side summary{padding:7px;cursor:pointer;font-weight:620}
.side details button{padding-left:24px}
.side small,.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:650}
.side hr,hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.rail{width:48px;display:flex;align-items:center;flex-direction:column;gap:8px;padding-top:12px}
.rail button{height:34px;width:34px}
.editor{display:flex;flex:1;min-width:0;flex-direction:column}
.tabs,.crumb{border-bottom:1px solid var(--line);padding:0 14px;flex-shrink:0}
.tabs{gap:4px;overflow-x:auto}
.tabs button{border-radius:0;padding:10px 8px}
.tabs .on{border-bottom:2px solid var(--accent)}
.crumb{padding:8px 16px;color:var(--mute);font:11px var(--mono)}
.canvas{flex:1;overflow:auto;min-height:0;padding:var(--pad)}
h1,h2,h3,p,pre{margin:0}
h1{font-size:var(--title);line-height:1.13;letter-spacing:-.05em}
h2{font-size:1.15rem;letter-spacing:-.024em}
h3{font-size:1rem}
.pagehead{margin-bottom:20px}
.pagehead .eyebrow{margin-bottom:6px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);margin:13px 0;overflow:hidden}
.card>header{background:var(--side);border-bottom:1px solid var(--line);padding:10px 14px}
.inside{padding:15px}
.stack>*+*{margin-top:13px}
.grid,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-block:1px solid var(--line);margin:16px 0}
.metric{padding:14px 12px;border-right:1px solid var(--line)}
.metric:last-child{border:0}
.metric strong{display:block;font-size:1.85rem;letter-spacing:-.06em}
.metric small{font:11px var(--mono)}
table{border-collapse:collapse;width:100%;text-align:left}
th,td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
th{font-size:.85rem;font-weight:550;color:var(--mute);background:var(--side)}
td button{max-width:100%;white-space:normal}
.chart{width:100%;height:115px;display:block;color:var(--accent)}
.chartlabels{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--mute)}
label{display:grid;gap:5px;font-weight:580}
input,select,textarea{padding:7px 9px;border:1px solid var(--edge);border-radius:var(--radius);background:var(--paper);min-width:0}
textarea{width:100%;resize:vertical}
input[type=checkbox]{accent-color:var(--accent)}
.url{display:flex;gap:6px}
.url input{flex:1;font-family:var(--mono)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 var(--mono)}
.code{background:var(--side);padding:14px;counter-reset:ln}
.code div{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.68 var(--mono)}
.code div:before{counter-increment:ln;content:counter(ln);display:inline-block;width:23px;color:var(--mute);user-select:none}
.key{color:var(--accent)}
.str{color:var(--good)}
.bottom{border-top:1px solid var(--edge);flex:none;max-height:23%;overflow:auto;background:var(--side)}
.bottom .spread{padding:3px 12px}
.bottom table{font:11px var(--mono)}
.bottom td{padding:4px 12px}
.inspector{width:200px;border-left:1px solid var(--line);border-right:0;padding:16px}
.inspector dl{line-height:1.8}
.inspector dd{margin:0 0 12px;font-family:var(--mono)}
.capture{width:clamp(300px,28vw,480px);background:var(--paper)}
.capture header{padding:18px 15px;background:var(--side)}
.capture input{width:100%;margin-top:12px}
.requestrow{display:grid;grid-template-columns:48px 1fr auto;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px;gap:4px 7px}
.requestrow small{grid-column:2/-1;font:10px var(--mono)}
.requestrow.on{box-shadow:inset 3px 0 var(--accent)}
footer{padding:5px 12px;border-top:1px solid var(--line);background:var(--side);font-size:10px;color:var(--mute)}
.menu{position:fixed;z-index:12;padding:5px;width:230px;background:var(--paper);border:1px solid var(--edge);border-radius:8px;box-shadow:0 8px 24px #0003;max-height:80vh;overflow:auto}
.menu button,.results button{width:100%;text-align:left;justify-content:space-between;border:0;background:transparent}
.menu button:hover,.menu button:focus,.results button:hover,.results .on{background:var(--wash);color:var(--accent)}
.menu hr{margin:4px}
.menu button{padding:5px 8px;font-size:13px}
dialog{color:var(--ink);background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:20px;width:min(520px,90vw);max-height:80vh;box-shadow:0 24px 80px #0004}
dialog::backdrop{background:#10131561}
dialog input,dialog textarea{width:100%}
.results{max-height:46vh;overflow:auto}
.results .eyebrow{margin:12px 8px 3px}
.toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;z-index:20}
.toast:empty{display:none}
.empty{display:grid;place-content:center;text-align:center;gap:18px;min-height:52vh}
.empty .row{justify-content:center}
.treebranch{margin-left:14px;border-left:1px solid var(--edge)}
.treebranch button{font:11px var(--mono);padding-left:10px!important}
.tabs .short{font-size:11px}
.wrap{flex-wrap:wrap}
.timeline{height:8px;display:flex;gap:2px;margin:10px 0}
.timeline i{background:var(--accent)}
.timeline i:nth-child(2){background:var(--good)}
.timeline i:last-child{background:var(--edge)}
.signal{display:flex;align-items:end;gap:2px;height:31px;overflow:hidden}
.signal i{background:var(--accent);width:4px}
.hero{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--side)}
.hero h2{font-size:1.7rem}
.hero p{color:var(--mute)}
.port{font:11px var(--mono);color:var(--mute)}
.caplist{padding:14px}
.caplist .eyebrow{margin-bottom:8px}
.side .backendname{font-size:1.12rem;font-weight:700}
.mini-pill{font:10px var(--mono);border:1px solid var(--edge);padding:2px 5px;border-radius:4px}
.statusbar{display:flex;align-items:center;gap:6px}
.subtle{color:var(--mute);font-size:.9rem}
.traces{background:var(--side);border:1px solid var(--line);padding:12px;border-radius:var(--radius)}
@media(max-width:1300px){.inspector{width:164px}
.canvas{padding:min(var(--pad),22px)}
.toolbar{gap:6px}
.side{width:182px}
}
.toolbar{background:var(--side);padding-block:7px}
.rail{background:light-dark(#243247,#141b26);color:#dbe6fa}
.rail .flat:hover{background:#344664}

.side{background:light-dark(#eaf0f7,#202632)}

.pagehead{margin-bottom:14px}
.card{margin:10px 0}
.inside{padding:12px}
.code div{line-height:1.52}
.inspector dt{color:var(--mute)}

.bottom table th{padding-block:2px}
.side summary svg{vertical-align:-3px;margin-inline:2px 5px}
.side small{display:block;margin:0 6px 6px}
.menu button:disabled{color:var(--mute);font-style:italic;background:var(--side)}

.switchtrack:before{content:"";height:10px;width:10px;border-radius:50%;background:var(--paper)}
[aria-checked=true] .switchtrack{background:var(--accent);justify-content:flex-end}

    case 'env':
    case 'libraryOpen':
      state.library = v || 'Environments';
      go('Requests');
      document.querySelector('.canvas .card:last-child')?.scrollIntoView({ block: 'nearest' });
      break;
    case 'import':
      modal(
        'Import cURL',
        '<label>Command<textarea id="curlinput" rows="4">curl -X GET https://localhost:8443/api/v1/products</textarea></label><hr>' +
          btn('Import request', 'applyImport', 'primary'),
      );
      break;
    case 'applyImport': {
      const cmd = $('#curlinput').value,
        url = cmd.match(/https?:\/\/[^\s'"]+/),
        verb = cmd.match(/-X\s+(GET|POST|PUT|PATCH|DELETE)/i);
      if (!url) {
        announce('Enter a cURL command with an HTTP URL');
        break;
      }
      closeModal();
      state.method = verb ? verb[1].toUpperCase() : 'GET';
      state.url = url[0].replace(base, '{{baseUrl}}');
      state.req = Math.max(
        0,
        endpoints.findIndex((e) => state.url.endsWith(e[1]) && state.method === e[0]),
      );
      go('Requests');
      announce('Request imported');
      break;
    }
    case 'reset':
      modal(
        'Reset Shop API data?',
        '<p>This replaces changes to products and orders with the sample seed records.</p><hr><div class="row">' +
          btn('Cancel', 'cancel') +
          btn('Reset data', 'confirmReset', 'destructive') +
          '</div>',
      );
      break;
    case 'confirmReset':
      closeModal();
      announce('Sample records restored');
      break;
    case 'cancel':
      closeModal();
      break;
    case 'qr':
      modal('Connect a device', '<div style="text-align:center">' + qrSvg + '<p class="mono">https://192.0.2.12:8443</p><small>Sample LAN address</small></div>');
      break;
    case 'shortcuts':
      modal(
        'Keyboard shortcuts',
        table(
          ['Action', 'Shortcut'],
          [
            ['Command palette', '⌘K'],
            ['Send request', '⌘↵'],
            ['Switch page', '⌘1–5'],
            ['Toggle sidebar', '⌘\\'],
            ['Toggle bottom panel', '⌘J'],
            ['Preferences', '⌘,'],
          ],
        ),
      );
      break;
    case 'mcp':
      state.mcp = !state.mcp;
      render();
      break;
    case 'sample':
      $('#sample-result').innerHTML = v === 'GraphQL' ? niceCode({ data: { products: records } }) : '<p class="method">Sample action complete</p>';
      break;
    case 'system':
      modal(v, '<p>' + esc(nativeNote(v)) + '</p>');
      break;
  }
}
function nativeNote(v) {
  if (v === 'JavaScript (fetch)') return 'await fetch(' + JSON.stringify(state.url.replace('{{baseUrl}}', base)) + ', {method: ' + JSON.stringify(state.method) + '});';
  if (v === 'Swift (URLSession)')
    return 'var request = URLRequest(url: URL(string: "' + state.url.replace('{{baseUrl}}', base) + '")!) · request.httpMethod = "' + state.method + '"';
  if (v === 'Shell (cURL)') return curl();
  if (v === 'About Tempo Local Backend') return 'Tempo Local Backend · ' + direction + ' design preview.';
  if (['Offline', 'Slow 3G', 'Random Failures', 'Clear Faults'].includes(v)) return 'Backend simulation preset · ' + v;
  return v + ' is represented here as a native app command in the desktop design.';
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) {
    if (!e.target.closest('.menu')) dismissMenu();
    if (e.target === dlg) {
      const r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeModal();
    }
    return;
  }
  if (b.dataset.menu) {
    if (menuName === b.dataset.menu) dismissMenu();
    else menuBox(b.dataset.menu, b);
    return;
  }
  if (b.dataset.sub) {
    menuBox(b.dataset.sub, b, true, true);
    return;
  }
  if (b.dataset.choice) {
    const v = b.dataset.choice;
    dismissMenu(true);
    run(commandMap[v] || 'system:' + v);
    return;
  }
  dismissMenu();
  if (b.dataset.act) run(b.dataset.act);
});
document.addEventListener('pointerover', (e) => {
  const b = e.target.closest('button');
  if (!b || !menuName) return;
  if (b.dataset.menu && b.dataset.menu !== menuName) menuBox(b.dataset.menu, b);
  if (b.dataset.sub) menuBox(b.dataset.sub, b, true);
  else if (b.closest('#mainmenu')) $('#submenu').replaceChildren();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'query') {
    paletteIndex = 0;
    searchResults(t.value);
  }
  if (t.id === 'filter') {
    state.filter = t.value;
    $('#capturelist').innerHTML = captureList();
  }
  if (t.dataset.field) {
    const k = t.dataset.field;
    if (k === 'method' || k === 'url') state[k] = t.value;
    else state.drafts[k] = t.value;
    if (k === 'permission') render();
  }
});
document.addEventListener(
  'toggle',
  (e) => {
    const g = e.target.dataset?.group;
    if (g && e.target.isConnected) {
      if (e.target.open) state.open.add(g);
      else state.open.delete(g);
    }
  },
  true,
);
document.addEventListener('keydown', (e) => {
  const key = e.key,
    cmd = e.metaKey || e.ctrlKey;
  if (key === 'Escape') {
    if (menuName) dismissMenu(true);
    if (dlg.open) closeModal();
    return;
  }
  if (menuName && ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(key)) {
    e.preventDefault();
    const sub = $('#submenu .menu'),
      active = document.activeElement,
      inSub = !!sub?.contains(active),
      box = inSub ? sub : $('#mainmenu .menu'),
      items = [...box.querySelectorAll('button:enabled')],
      i = items.indexOf(active);
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      items[(i + (key === 'ArrowDown' ? 1 : i < 0 ? 0 : -1) + items.length) % items.length]?.focus();
      return;
    }
    if (key === 'Enter' || key === ' ') {
      if (i < 0) items[0]?.focus();
      else active.click();
      return;
    }
    if (key === 'ArrowRight' && active.dataset.sub) {
      menuBox(active.dataset.sub, active, true, true);
      return;
    }
    if (key === 'ArrowLeft' && inSub) {
      $('#submenu').replaceChildren();
      subTrigger.focus();
      return;
    }
    const titles = [...document.querySelectorAll('[data-menu]')],
      n = titles.indexOf(menuTrigger),
      next = titles[(n + (key === 'ArrowRight' ? 1 : -1) + titles.length) % titles.length];
    menuBox(next.dataset.menu, next, false, true);
    return;
  }
  if (dlg.open && $('#query') && (e.target.id === 'query' || e.target.closest('#results')) && ['ArrowDown', 'ArrowUp', 'Enter'].includes(key)) {
    e.preventDefault();
    const items = [...$('#results').querySelectorAll('button')];
    if (!items.length) return;
    if (key === 'Enter') {
      (e.target.closest('#results button') || items[paletteIndex]).click();
      return;
    }
    paletteIndex = (paletteIndex + (key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    searchResults($('#query').value);
    $('#results .on')?.scrollIntoView({ block: 'nearest' });
    $('#query').focus();
    return;
  }
  if (cmd && key.toLowerCase() === 'k') {
    e.preventDefault();
    if (dlg.open) closeModal();
    else palette();
    return;
  }
  if (dlg.open) return;
  if (e.target.dataset.menu && ['ArrowDown', 'ArrowUp'].includes(key)) {
    e.preventDefault();
    menuBox(e.target.dataset.menu, e.target, false, true);
    return;
  }
  const shortcuts = {
    1: 'go:Overview',
    2: 'go:Endpoints',
    3: 'go:Collections',
    4: 'go:Logs',
    5: 'go:Requests',
    ',': 'go:Preferences',
    j: 'bottom',
    '\\': 'sidebar',
    s: 'save',
    Enter: 'send',
    t: 'go:Requests',
    n: 'new',
    o: 'open',
    '.': 'stop',
    '/': 'shortcuts',
  };
  if (cmd) {
    const action =
      key.toLowerCase() === 'r'
        ? e.shiftKey
          ? 'restart'
          : 'start'
        : e.altKey && key.toLowerCase() === 'i'
          ? 'inspect'
          : e.shiftKey && key.toLowerCase() === 'c'
            ? 'base'
            : shortcuts[key];
    if (action) {
      e.preventDefault();
      dismissMenu();
      run(action);
    }
  }
});
render();
</script></body></html>
