# @tempo-feature:ci-github:start
name: Release

# release-please opens a release PR from Conventional Commits. Merging it creates the tag and GitHub release,
# then this workflow dispatches build.yml for prod on both platforms.
# Enable "Allow GitHub Actions to create and approve pull requests" in the repository settings.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Dispatch prod build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # A tag created with GITHUB_TOKEN does not trigger build.yml's `v*` tag trigger, so dispatch it.
      - name: Dispatch build.yml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f env=prod -f platform=both -f lane=release
# @tempo-feature:ci-github:end
