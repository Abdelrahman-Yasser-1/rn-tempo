name: AI changes report

# Posts one sticky comment on each PR summarising its AI-assisted commits, built from commit
# trailers only (AI-Assisted: <tool>/<model>): the count, a grouping per tool/model and the commits
# in each group. Session logs are local only and are never read. Needs only read access to the
# contents plus write access to PR comments. Skipped for forks (their token is read-only).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: AI changes
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const { BASE_SHA, HEAD_SHA } = process.env;
          const MAX_TOTAL = 60000;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });

          const commits = git(
            'log', `${BASE_SHA}..${HEAD_SHA}`,
            '--format=%h%x1f%s%x1f%(trailers:key=AI-Assisted,valueonly,separator=%x2C)%x1e',
          )
            .split('\x1e')
            .map((record) => record.trim())
            .filter(Boolean)
            .map((record) => {
              const [sha, subject, tool] = record.split('\x1f').map((part) => part.trim());
              return { sha, subject, tool };
            });
          const assisted = commits.filter((commit) => commit.tool);

          // Subjects are rendered inside a code fence that is longer than any run of ~ they contain.
          const fence = (text) => {
            const longest = Math.max(0, ...(text.match(/~+/g) ?? []).map((run) => run.length));
            return '~'.repeat(Math.max(4, longest + 1));
          };
          const block = (text) => `${fence(text)}text\n${text}\n${fence(text)}`;
          const clip = (text, max) => (text.length > max ? `${text.slice(0, max)}\n... (truncated)` : text);

          const groups = new Map();
          for (const commit of assisted) {
            groups.set(commit.tool, [...(groups.get(commit.tool) ?? []), commit]);
          }

          let body = '## AI changes\n\n';
          body += `${assisted.length} of ${commits.length} commit${commits.length === 1 ? '' : 's'} in this PR ${assisted.length === 1 ? 'is' : 'are'} AI-assisted.\n\n`;
          if (assisted.length === 0) {
            body += 'No AI-Assisted trailers were found in this PR.\n';
          }
          for (const [tool, own] of groups) {
            body += `### ${tool.replaceAll('`', "'")} (${own.length})\n\n`;
            body += `${block(own.map((commit) => `${commit.sha} ${commit.subject}`).join('\n'))}\n\n`;
          }
          writeFileSync('ai-report.md', clip(body, MAX_TOTAL));
          NODE
      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ai-report
          path: ai-report.md
