# @tempo-feature:maestro:start
name: E2E

# Maestro flows on an Android emulator against an isolated, temporary copy of your Tempo backend (a CI session on
# your team server). Needs the repository variable TEMPO_BACKEND_URL (https://<host>/b/<name>) and the secret
# TEMPO_SESSIONS_KEY (a key with the `sessions` scope). Runs for PRs labelled `e2e`, nightly, and on demand.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro (Android emulator)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check for flows
        id: flows
        run: |
          if [ -d e2e/flows ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No e2e/flows directory, skipping."; fi
      - name: Install Maestro
        if: steps.flows.outputs.found == 'true'
        run: |
          curl -sSfL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME/maestro"
          rm maestro.zip
          echo "$HOME/maestro/maestro/bin" >> "$GITHUB_PATH"
      # The dev flavor reads .env.dev. The flows run against a temporary copy of the team backend that only this run
      # sees (see docs: Backend, "Test without mock data", CI sessions). It is deleted in the last step.
      - name: Start a backend session
        if: steps.flows.outputs.found == 'true'
        env:
          TEMPO_BACKEND_URL: ${{ vars.TEMPO_BACKEND_URL }}
          TEMPO_SESSIONS_KEY: ${{ secrets.TEMPO_SESSIONS_KEY }}
        run: |
          session=$(curl -sS --fail -X POST -H "Authorization: Bearer ${TEMPO_SESSIONS_KEY}" \
            -H 'content-type: application/json' -d '{"ttlSeconds": 3600}' "${TEMPO_BACKEND_URL}/__sessions")
          echo "TEMPO_SESSION_ID=$(echo "$session" | jq -r .id)" >> "$GITHUB_ENV"
          url=$(echo "$session" | jq -r .url | sed 's#/$##')
          echo "::add-mask::${url}"
          if grep -q '^API_BASE_URL=' .env.dev; then sed -i "s#^API_BASE_URL=.*#API_BASE_URL=${url}#" .env.dev; else echo "API_BASE_URL=${url}" >> .env.dev; fi
      # A release build bundles only the icons the code names; the runner is ephemeral.
      - name: Prune unused icons
        if: steps.flows.outputs.found == 'true'
        run: yarn icons:prune
      - name: Build devRelease APK
        if: steps.flows.outputs.found == 'true'
        working-directory: android
        run: ./gradlew assembleDevRelease
      - name: Enable KVM
        if: steps.flows.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro flows
        if: steps.flows.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: sh -c 'adb install -r android/app/build/outputs/apk/dev/release/app-dev-release.apk && maestro test e2e/flows --format junit --output e2e-report.xml'
      - uses: actions/upload-artifact@v7
        if: always() && steps.flows.outputs.found == 'true'
        with:
          name: e2e-report
          path: e2e-report.xml
          if-no-files-found: warn
      - name: Delete the backend session
        if: always() && env.TEMPO_SESSION_ID != ''
        env:
          TEMPO_BACKEND_URL: ${{ vars.TEMPO_BACKEND_URL }}
          TEMPO_SESSIONS_KEY: ${{ secrets.TEMPO_SESSIONS_KEY }}
        run: curl -sS -X DELETE -H "Authorization: Bearer ${TEMPO_SESSIONS_KEY}" "${TEMPO_BACKEND_URL}/__sessions/${TEMPO_SESSION_ID}"
# @tempo-feature:maestro:end
