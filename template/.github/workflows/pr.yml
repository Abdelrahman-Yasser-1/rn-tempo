name: PR

# Workflows in `.github/` run at the root of a generated project, so paths have no `template/` prefix.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, format, i18n, tests)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Corepack must be on before setup-node so the yarn cache can find the right yarn.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn verify
      # Fork PRs get a read-only token, so the comment step is skipped for them.
      - name: Jest coverage summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ArtiomTr/jest-coverage-report-action@262a7bb0b20c4d1d6b6b026af0f008f78da72788 # v2.3.1
        with:
          test-script: yarn jest
          package-manager: yarn
          skip-step: install

  commitlint:
    name: Commit messages
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Lint every commit in the PR
        run: yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # The title is linted with the project's own commitlint config, so custom feature scopes just work.
      # It goes through an env var, never inline `${{ }}` in the script (injection risk).
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint --verbose

  danger:
    name: Danger
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  doctor:
    name: Tempo doctor
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # `create-tempo-app` is an exact-pinned devDependency of generated projects (WS14), so the CLI comes
      # from the lockfile. Findings are non-blocking; a run that produced no report (exec error) fails.
      - name: Run tempo doctor
        run: |
          if [ -x node_modules/.bin/tempo ]; then
            status=0
            yarn tempo doctor --ci > doctor.txt 2>&1 || status=$?
            cat doctor.txt
            if [ ! -s doctor.txt ]; then exit "$status"; fi
          else
            echo "tempo CLI not installed, skipping" | tee doctor.txt
          fi
      - name: Format doctor output
        if: always()
        run: |
          {
            echo '### tempo doctor'
            echo
            echo '```'
            cat doctor.txt 2>/dev/null || echo 'tempo doctor did not run'
            echo '```'
          } > doctor.md
      - name: Comment doctor output
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: tempo-doctor
          path: doctor.md

  gitleaks:
    name: Secret scan
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v
