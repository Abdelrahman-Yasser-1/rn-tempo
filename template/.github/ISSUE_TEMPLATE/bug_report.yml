name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app on ...
        2. Tap ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Both]
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [dev, staging, prod]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device or OS version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens and personal data before pasting.
