apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// @tempo-feature:firebase-core:start
// Firebase, one project per environment. The config files live in firebase/<flavor>/google-services.json
// (see firebase/README.md). The google-services plugin only reads files inside the app module, so the task
// syncFirebaseConfig<Flavor> copies the flavor's file to app/src/<flavor>/google-services.json (a gitignored
// build artifact) before the plugin runs, and only when .env.<flavor> has FIREBASE_ENABLED=true. When it is
// not true the copy is deleted, so a stale file can never leak into another environment's build.
// A flavor without a file must not fail the build, hence IGNORE: the app then runs with no Firebase app.
apply plugin: "com.google.gms.google-services"
googleServices {
    missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.IGNORE
}

// Reads KEY=value lines of .env.<flavor> directly (the last assignment wins, like react-native-config).
// react-native-config's dotenv.gradle picks the env file from the requested task names, which is not
// reliable at configuration time (IDE sync, several variants in one build), so it is not used here.
def readFlavorEnv = { String flavorName, String key ->
    def envFile = new File(rootProject.projectDir.parentFile, ".env.${flavorName}")
    String value = null
    if (envFile.isFile()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            def separator = trimmed.indexOf("=")
            if (!trimmed.startsWith("#") && separator > 0 && trimmed.substring(0, separator).trim() == key) {
                value = trimmed.substring(separator + 1).trim().replaceAll(/^["']|["']$/, "")
            }
        }
    }
    return value
}

afterEvaluate {
    android.productFlavors.all { flavor ->
        def flavorName = flavor.name
        def capitalized = flavorName.capitalize()
        def source = new File(rootProject.projectDir.parentFile, "firebase/${flavorName}/google-services.json")
        def target = file("src/${flavorName}/google-services.json")
        def sync = tasks.register("syncFirebaseConfig${capitalized}") {
            group = "firebase"
            description = "Copies firebase/${flavorName}/google-services.json into the ${flavorName} flavor when FIREBASE_ENABLED=true."
            doLast {
                if (readFlavorEnv(flavorName, "FIREBASE_ENABLED") != "true") {
                    target.delete()
                    logger.lifecycle("firebase-core: ${flavorName}: FIREBASE_ENABLED is not true, building without Firebase.")
                } else if (!source.isFile()) {
                    throw new GradleException(
                        ".env.${flavorName} has FIREBASE_ENABLED=true but ${source} is missing. " +
                        "Download it from the Firebase console (see firebase/README.md) or set FIREBASE_ENABLED=false.")
                } else {
                    target.parentFile.mkdirs()
                    target.bytes = source.bytes
                    logger.lifecycle("firebase-core: ${flavorName}: using firebase/${flavorName}/google-services.json.")
                }
            }
        }
        tasks.matching { it.name.startsWith("process${capitalized}") && it.name.endsWith("GoogleServices") }.configureEach {
            dependsOn sync
        }
    }
}
// @tempo-feature:firebase-core:end
// @tempo-feature:crashlytics:start
// Crashlytics: the plugin injects the build id the SDK needs and uploads the R8 mapping file of release
// builds. It is applied for every flavor (a plugin cannot be applied per flavor), but a flavor whose
// .env.<flavor> has no FIREBASE_ENABLED=true has no google-services.json to upload with, so its mapping
// upload is switched off. NDK symbol upload stays off (the plugin default); to enable it, add
// firebaseCrashlytics { nativeSymbolUploadEnabled true } to buildTypes.release and set
// "crashlytics_ndk_enabled": true in firebase.json (see the Crashlytics docs page).
apply plugin: "com.google.firebase.crashlytics"
androidComponents {
    onVariants(selector().all()) { variant ->
        def isFirebaseOn = readFlavorEnv(variant.flavorName, "FIREBASE_ENABLED") == "true"
        def crashlytics = variant.getExtension(com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsVariantExtension)
        if (crashlytics != null && !isFirebaseOn) {
            crashlytics.mappingFileUploadEnabled.set(false)
            crashlytics.nativeSymbolUploadEnabled.set(false)
        }
    }
}
// @tempo-feature:crashlytics:end

// Maps each build variant (lowercase) to its env file. Must be set before the dotenv.gradle `apply from`.
project.ext.envConfigFiles = [
    devdebug: ".env.dev", devrelease: ".env.dev",
    stagingdebug: ".env.staging", stagingrelease: ".env.staging",
    proddebug: ".env.prod", prodrelease: ".env.prod",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["devDebug", "stagingDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// package.json (bumped by release-please) is the single source of the marketing version.
def packageVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version as String

def uploadProp = { String name -> project.findProperty(name) ?: System.getenv(name) }
def allowDebugSigning = (project.findProperty("tempoAllowDebugSigning") ?: System.getenv("TEMPO_ALLOW_DEBUG_SIGNING")) == "true"
def hasUploadKey = ["TEMPO_UPLOAD_STORE_FILE", "TEMPO_UPLOAD_STORE_PASSWORD", "TEMPO_UPLOAD_KEY_ALIAS", "TEMPO_UPLOAD_KEY_PASSWORD"].every { uploadProp(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rntempo.app"
    defaultConfig {
        applicationId "com.rntempo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Fastlane passes -PtempoVersionCode=<run number> (and -PtempoVersionName, which equals the
        // package.json version); without them versionName is the package.json version.
        versionCode((project.findProperty("tempoVersionCode") ?: 1) as int)
        versionName((project.findProperty("tempoVersionName") ?: packageVersion) as String)
        // @tempo-feature:maps:start
        // Google Maps key for the manifest, read from the flavor's env file by react-native-config's
        // dotenv.gradle (above). Flavor placeholders below merge with this one. Empty is allowed.
        manifestPlaceholders = [googleMapsApiKey: (project.env.get("GOOGLE_MAPS_API_KEY") ?: "")]
        // @tempo-feature:maps:end
    }
    buildFeatures {
        buildConfig true
    }
    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Tempo Dev"
            manifestPlaceholders = [deepLinkScheme: "tempo-dev", deepLinkHost: "example.invalid"]
            buildConfigField "String", "APP_ENV", "\"dev\""
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Tempo Stg"
            manifestPlaceholders = [deepLinkScheme: "tempo-staging", deepLinkHost: "example.invalid"]
            buildConfigField "String", "APP_ENV", "\"staging\""
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Tempo"
            manifestPlaceholders = [deepLinkScheme: "tempo", deepLinkHost: "example.invalid"]
            buildConfigField "String", "APP_ENV", "\"prod\""
        }
    }
    signingConfigs {
        // Upload key: TEMPO_UPLOAD_* come from ~/.gradle/gradle.properties or the environment (CI).
        if (hasUploadKey) {
            release {
                storeFile file(uploadProp("TEMPO_UPLOAD_STORE_FILE"))
                storePassword uploadProp("TEMPO_UPLOAD_STORE_PASSWORD")
                keyAlias uploadProp("TEMPO_UPLOAD_KEY_ALIAS")
                keyPassword uploadProp("TEMPO_UPLOAD_KEY_PASSWORD")
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            } else {
                // Without the upload key, release builds are signed with the debug keystore for local
                // testing only. prodRelease refuses this unless explicitly allowed (see taskGraph check below).
                logger.warn("WARNING: TEMPO_UPLOAD_* signing properties are missing, signing the release build with the debug keystore. Never ship this build.")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// prodRelease must never be silently signed with the debug keystore. Opt in for local testing with
// `-PtempoAllowDebugSigning=true` (or env TEMPO_ALLOW_DEBUG_SIGNING=true).
// The check looks at the tasks that actually sign/package prod release output, so it also covers
// `assembleRelease`, `bundleRelease`, `build`, ... Shared internal tasks (preProdReleaseBuild) appear in
// other variants' graphs and are deliberately not matched.
def prodReleaseSigningTasks = ["validateSigningProdRelease", "packageProdRelease", "signProdReleaseBundle", "bundleProdRelease"]
gradle.taskGraph.whenReady { graph ->
    def prodReleaseSigned = graph.allTasks.any { it.project == project && it.name in prodReleaseSigningTasks }
    if (prodReleaseSigned && !hasUploadKey) {
        if (allowDebugSigning) {
            logger.warn("WARNING: ##### prodRelease is signed with the DEBUG keystore (tempoAllowDebugSigning). DO NOT DISTRIBUTE. #####")
        } else {
            throw new GradleException(
                "prodRelease needs the upload key. Set TEMPO_UPLOAD_STORE_FILE, TEMPO_UPLOAD_STORE_PASSWORD, " +
                "TEMPO_UPLOAD_KEY_ALIAS and TEMPO_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties or the environment. " +
                "For local testing only, pass -PtempoAllowDebugSigning=true (or TEMPO_ALLOW_DEBUG_SIGNING=true) to sign with the debug keystore.")
        }
    }
}
