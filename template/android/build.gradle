buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // @tempo-feature:firebase-core:start
        // Applied in app/build.gradle; a flavor without google-services.json is ignored there.
        classpath("com.google.gms:google-services:4.5.0")
        // @tempo-feature:firebase-core:end
        // @tempo-feature:crashlytics:start
        // Uploads the R8 mapping file of release builds; the version is the one React Native Firebase 27 tests.
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.8")
        // @tempo-feature:crashlytics:end
    }
}

apply plugin: "com.facebook.react.rootproject"
